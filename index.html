<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asflt</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121216">

  <link rel="icon" type="image/png" sizes="192x192" href="asflt_icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="asflt_icon-512.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100vw; background: #111; overflow: hidden; font-family: Roboto, -apple-system, sans-serif; }
    
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d11;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.35s ease-out;
    }

    #splash-screen img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    #splash-screen h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f3f4f6;
      text-transform: uppercase;
    }

    #fog-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 400;
      pointer-events: none;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 500;
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    .trip-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .stat-card h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 600;
      color: #f3f4f6;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-badge { padding: 4px 10px; font-size: 11px; border-radius: 6px; flex: initial; }
    button:active { opacity: 0.7; }

    #trip-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      background: rgba(10, 10, 14, 0.95);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 20px 16px;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .close-btn { background: transparent; color: #9ca3af; font-size: 18px; border: none; padding: 4px 8px; cursor: pointer; }

    .trip-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trip-item {
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .trip-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Fargevelger runding */
    .color-picker-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      padding: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .color-picker-btn input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    .trip-info h5 { font-size: 13px; font-weight: 600; color: #f3f4f6; margin-bottom: 3px; }
    .trip-info p { font-size: 11px; color: #9ca3af; }

    .trip-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-view-trip { 
      padding: 6px 12px; 
      font-size: 11px; 
      border-radius: 6px; 
      background: #2563eb; 
      color: #fff; 
      flex: initial; 
    }

    .btn-delete-trip {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      flex: initial;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="asflt_icon-512.png" onerror="this.src='asflt_icon-192.png'" alt="Asflt">
    <h1>Asflt</h1>
  </div>

  <div id="map"></div>
  <canvas id="fog-canvas"></canvas>

  <div class="hud">
    <div class="header-row">
      <div class="app-title-wrap">
        <div class="app-title">Asflt</div>
        <div class="trip-badge" id="trip-badge">Aktiv</div>
      </div>
      <button class="btn-secondary btn-badge" id="btn-open-trips">Historikk</button>
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <h4>I dag</h4>
        <div class="stat-val" id="day-dist">0 m</div>
        <div class="stat-val" id="day-steps" style="font-size: 12px; color: #9ca3af;">0 skritt</div>
      </div>
      <div class="stat-card">
        <h4>Aktiv tur</h4>
        <div class="stat-val" id="trip-dist">0 m</div>
        <div class="stat-val" id="trip-steps" style="font-size: 12px; color: #9ca3af;">0 skritt</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-recenter">Sentrer meg</button>
      <button class="btn-secondary" id="btn-manual-new-trip">Start ny tur</button>
    </div>
  </div>

  <div id="trip-modal">
    <div class="modal-header">
      <h2>Lagrede turer</h2>
      <button class="close-btn" id="btn-close-trips">✕ Lukk</button>
    </div>
    <div class="trip-list" id="trip-list-container"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const PALETTE = [
      '#38bdf8', // Neon cyan
      '#a855f7', // Lilla
      '#22c55e', // Emerald grønn
      '#f97316', // Oransje
      '#ec4899', // Rosa
      '#eab308', // Gul
      '#06b6d4', // Turkis
      '#ef4444'  // Rød
    ];

    function getRandomColor() {
      return PALETTE[Math.floor(Math.random() * PALETTE.length)];
    }

    // WakeLock for å forhindre at skjerm og prosess sovner i lommen
    let wakeLock = null;
    async function activateWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (e) { console.warn('WakeLock:', e); }
      }
    }
    activateWakeLock();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') activateWakeLock();
    });

    const initialLat = 62.37;
    const initialLng = 6.03;
    let followUser = true;

    const map = L.map('map', { zoomControl: false }).setView([initialLat, initialLng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    map.on('dragstart', () => {
      followUser = false;
    });

    const userMarker = L.circleMarker([initialLat, initialLng], {
      radius: 7,
      color: '#ffffff',
      fillColor: '#2563eb',
      fillOpacity: 1,
      weight: 3
    }).addTo(map);

    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      map.invalidateSize();
      redrawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      splash.style.opacity = '0';
      setTimeout(() => {
        splash.style.display = 'none';
        resizeCanvas();
      }, 350);
    }, 1200);

    const todayStr = new Date().toISOString().slice(0, 10);
    let trips = JSON.parse(localStorage.getItem('asflt_trips') || '[]');
    let currentTrip = JSON.parse(localStorage.getItem('asflt_current_trip') || 'null');

    let state = {
      reveals: JSON.parse(localStorage.getItem('asflt_reveals') || '[]'),
      dayDate: localStorage.getItem('asflt_day_date') || todayStr,
      dayDist: parseFloat(localStorage.getItem('asflt_day_dist') || '0'),
      daySteps: parseInt(localStorage.getItem('asflt_day_steps') || '0', 10),
      lastCoord: null
    };

    if (state.dayDate !== todayStr) {
      state.dayDate = todayStr;
      state.dayDist = 0;
      state.daySteps = 0;
      localStorage.setItem('asflt_day_date', todayStr);
      localStorage.setItem('asflt_day_dist', '0');
      localStorage.setItem('asflt_day_steps', '0');
    }

    function createNewTrip(startCoord = null) {
      return {
        id: Date.now(),
        color: getRandomColor(),
        startTime: new Date().toISOString(),
        dist: 0,
        steps: 0,
        path: startCoord ? [startCoord] : []
      };
    }

    // Opprett en ny tur hvis ingen finnes
    if (!currentTrip) {
      currentTrip = createNewTrip();
      localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));
    } else if (!currentTrip.color) {
      currentTrip.color = getRandomColor();
    }

    // Kartlag for rute-sporing (polylines)
    let currentPolyline = L.polyline([], {
      color: currentTrip.color,
      weight: 5,
      opacity: 0.9,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    if (currentTrip.path && currentTrip.path.length > 0) {
      currentPolyline.setLatLngs(currentTrip.path.map(p => [p.lat, p.lng]));
    }

    // Lagrer turen kontinuerlig i historikklisten
    function persistTripSnapshot() {
      localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));
      
      const idx = trips.findIndex(t => t.id === currentTrip.id);
      if (idx >= 0) {
        trips[idx] = currentTrip;
      } else if (currentTrip.path.length >= 2) {
        trips.unshift(currentTrip);
      }
      localStorage.setItem('asflt_trips', JSON.stringify(trips));
    }

    function startNewTrip(startCoord = null) {
      persistTripSnapshot();
      currentTrip = createNewTrip(startCoord);
      localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));

      if (currentPolyline) {
        map.removeLayer(currentPolyline);
      }
      currentPolyline = L.polyline([], {
        color: currentTrip.color,
        weight: 5,
        opacity: 0.9,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      if (startCoord) {
        currentPolyline.addLatLng([startCoord.lat, startCoord.lng]);
      }

      updateUI();
    }

    let inspectedTripLayer = null;
    const REVEAL_RADIUS_METERS = 42;

    function redrawFog() {
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(10, 12, 18, 0.96)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'destination-out';
      
      for (let i = 0; i < state.reveals.length; i++) {
        drawRevealCircle(state.reveals[i].lat, state.reveals[i].lng);
      }

      if (state.lastCoord) {
        drawRevealCircle(state.lastCoord.lat, state.lastCoord.lng);
      }
    }

    function drawRevealCircle(lat, lng) {
      const containerPoint = map.latLngToContainerPoint([lat, lng]);
      const edgeLatLng = [lat + (REVEAL_RADIUS_METERS / 111320), lng];
      const edgePoint = map.latLngToContainerPoint(edgeLatLng);
      const pixelRadius = Math.max(26, Math.abs(edgePoint.y - containerPoint.y));

      const grad = ctx.createRadialGradient(
        containerPoint.x, containerPoint.y, pixelRadius * 0.45,
        containerPoint.x, containerPoint.y, pixelRadius
      );
      grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(containerPoint.x, containerPoint.y, pixelRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    map.on('move', redrawFog);
    map.on('zoom', redrawFog);

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const dPhi = ((lat2 - lat1) * Math.PI) / 180;
      const dLambda = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDist(meters) {
      return meters >= 1000 ? `${(meters / 1000).toFixed(2)} km` : `${Math.round(meters)} m`;
    }

    function updateUI() {
      document.getElementById('day-dist').innerText = formatDist(state.dayDist);
      document.getElementById('day-steps').innerText = `${state.daySteps} skritt`;
      document.getElementById('trip-dist').innerText = formatDist(currentTrip.dist);
      document.getElementById('trip-steps').innerText = `${currentTrip.steps} skritt`;
    }

    // Kontinuerlig GPS-sporing og automatisk tur-oppdatering
    let firstFix = true;
    if ('geolocation' in navigator) {
      navigator.geolocation.watchPosition(
        pos => {
          const { latitude: lat, longitude: lng, accuracy } = pos.coords;
          if (accuracy > 45) return;

          userMarker.setLatLng([lat, lng]);
          const currentCoord = { lat, lng };

          if (followUser) {
            map.panTo([lat, lng], { animate: !firstFix, duration: 0.6 });
          }

          if (firstFix) {
            map.setView([lat, lng], 17);
            firstFix = false;
            state.lastCoord = currentCoord;
            state.reveals.push(currentCoord);
            localStorage.setItem('asflt_reveals', JSON.stringify(state.reveals));
            
            if (currentTrip.path.length === 0) {
              currentTrip.path.push(currentCoord);
              currentPolyline.addLatLng([lat, lng]);
            }
            redrawFog();
          }

          if (state.lastCoord) {
            const delta = calcDistance(state.lastCoord.lat, state.lastCoord.lng, lat, lng);

            if (delta >= 2.5 && delta < 200) {
              state.dayDist += delta;
              localStorage.setItem('asflt_day_dist', state.dayDist);

              currentTrip.dist += delta;
              currentTrip.path.push(currentCoord);
              currentPolyline.addLatLng([lat, lng]);

              state.reveals.push(currentCoord);
              localStorage.setItem('asflt_reveals', JSON.stringify(state.reveals));

              state.lastCoord = currentCoord;

              // Skriv kontinuerlig til localStorage slik at turen ALDRI mistes
              persistTripSnapshot();
              redrawFog();
            }
          } else {
            state.lastCoord = currentCoord;
            redrawFog();
          }

          updateUI();
        },
        err => console.warn(err),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    }

    // Skritteller
    let lastAccel = 0;
    let stepCooldown = false;
    const STEP_THRESHOLD = 11.2;

    window.addEventListener('devicemotion', (event) => {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;
      const mag = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);

      if (mag > STEP_THRESHOLD && !stepCooldown && (mag - lastAccel) > 1.2) {
        state.daySteps++;
        if (currentTrip) {
          currentTrip.steps++;
          persistTripSnapshot();
        }
        localStorage.setItem('asflt_day_steps', state.daySteps);
        updateUI();
        stepCooldown = true;
        setTimeout(() => { stepCooldown = false; }, 300);
      }
      lastAccel = mag;
    });

    // Historikk & Fargevelger
    const modal = document.getElementById('trip-modal');
    const tripListContainer = document.getElementById('trip-list-container');

    document.getElementById('btn-open-trips').addEventListener('click', () => {
      renderTripList();
      modal.style.display = 'flex';
    });

    document.getElementById('btn-close-trips').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    function deleteTrip(idx) {
      if (!confirm("Vil du slette denne turen fra listen? (Kartet forblir utforsket)")) return;

      const deleted = trips.splice(idx, 1)[0];
      localStorage.setItem('asflt_trips', JSON.stringify(trips));

      if (inspectedTripLayer) {
        map.removeLayer(inspectedTripLayer);
        inspectedTripLayer = null;
      }

      if (currentTrip && currentTrip.id === deleted.id) {
        startNewTrip(state.lastCoord);
      }

      renderTripList();
    }

    function renderTripList() {
      tripListContainer.innerHTML = '';
      if (trips.length === 0) {
        tripListContainer.innerHTML = '<p style="color: #9ca3af; text-align: center; margin-top: 40px;">Ingen turer lagret enda.</p>';
        return;
      }

      trips.forEach((t, idx) => {
        const date = new Date(t.startTime).toLocaleDateString('no-NO', { 
          day: '2-digit', 
          month: 'short', 
          hour: '2-digit', 
          minute: '2-digit' 
        });
        const color = t.color || '#3b82f6';
        
        const item = document.createElement('div');
        item.className = 'trip-item';
        item.innerHTML = `
          <div class="trip-left">
            <div class="color-picker-btn" style="background: ${color};" title="Endre farge">
              <input type="color" value="${color}" data-idx="${idx}">
            </div>
            <div class="trip-info">
              <h5>Tur #${trips.length - idx} – ${date}</h5>
              <p>${formatDist(t.dist)} • ${t.steps} skritt</p>
            </div>
          </div>
          <div class="trip-actions">
            <button class="btn-view-trip" data-idx="${idx}">Vis</button>
            <button class="btn-delete-trip" data-del-idx="${idx}">Slett</button>
          </div>
        `;
        tripListContainer.appendChild(item);
      });

      // Endre farge på tur
      document.querySelectorAll('.color-picker-btn input[type="color"]').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-idx'), 10);
          const newColor = e.target.value;
          trips[idx].color = newColor;
          e.target.parentElement.style.background = newColor;

          if (currentTrip && currentTrip.id === trips[idx].id) {
            currentTrip.color = newColor;
            currentPolyline.setStyle({ color: newColor });
            localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));
          }
          if (inspectedTripLayer && inspectedTripLayer._tripId === trips[idx].id) {
            inspectedTripLayer.setStyle({ color: newColor });
          }

          localStorage.setItem('asflt_trips', JSON.stringify(trips));
        });
      });

      document.querySelectorAll('.btn-view-trip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.getAttribute('data-idx'), 10);
          showTripOnMap(trips[idx]);
          modal.style.display = 'none';
        });
      });

      document.querySelectorAll('.btn-delete-trip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.getAttribute('data-del-idx'), 10);
          deleteTrip(idx);
        });
      });
    }

    function showTripOnMap(trip) {
      followUser = false;
      if (inspectedTripLayer) {
        map.removeLayer(inspectedTripLayer);
      }
      if (!trip.path || trip.path.length < 2) return;

      const latlngs = trip.path.map(p => [p.lat, p.lng]);
      inspectedTripLayer = L.polyline(latlngs, {
        color: trip.color || '#60a5fa',
        weight: 6,
        opacity: 0.95
      }).addTo(map);
      inspectedTripLayer._tripId = trip.id;

      map.fitBounds(inspectedTripLayer.getBounds(), { padding: [60, 60] });
    }

    document.getElementById('btn-recenter').addEventListener('click', () => {
      followUser = true;
      activateWakeLock();
      if (inspectedTripLayer) {
        map.removeLayer(inspectedTripLayer);
        inspectedTripLayer = null;
      }
      if (state.lastCoord) {
        map.setView([state.lastCoord.lat, state.lastCoord.lng], 17);
      }
      redrawFog();
    });

    document.getElementById('btn-manual-new-trip').addEventListener('click', () => {
      startNewTrip(state.lastCoord);
    });

    resizeCanvas();
    updateUI();
  </script>
</body>
</html>
