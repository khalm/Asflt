<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asflt</title>
  
  <meta name="theme-color" content="#121216">
  <link rel="icon" type="image/png" sizes="192x192" href="asflt_icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="asflt_icon-512.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #map { height: 100%; width: 100vw; background: #111; overflow: hidden; font-family: Roboto, -apple-system, sans-serif; }
    
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0d0d11;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.35s ease-out;
    }

    #splash-screen img {
      width: 110px;
      height: 110px;
      border-radius: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    #splash-screen h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f3f4f6;
      text-transform: uppercase;
    }

    #fog-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 400;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 500;
      background: rgba(18, 18, 22, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 12px 16px;
      color: #fff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #f3f4f6;
    }

    .trip-badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.1);
      color: #9ca3af;
      transition: background 0.3s, color 0.3s;
    }

    .trip-badge.walking {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.3);
    }

    .trip-badge.vehicle {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 10px;
      border-radius: 8px;
    }

    .stat-card h4 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #9ca3af;
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 14px;
      font-weight: 600;
      color: #f3f4f6;
    }

    .btn-row {
      display: flex;
      gap: 8px;
    }

    button {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-secondary { background: rgba(255, 255, 255, 0.15); color: #fff; }
    .btn-badge { padding: 4px 10px; font-size: 11px; border-radius: 6px; flex: initial; }
    button:active { opacity: 0.7; }

    #visible-route-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      color: #93c5fd;
    }

    #visible-route-banner button {
      flex: initial;
      padding: 4px 10px;
      font-size: 11px;
      background: #ef4444;
      color: #fff;
    }

    #trip-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      background: rgba(10, 10, 14, 0.95);
      z-index: 1000;
      display: none;
      flex-direction: column;
      padding: 20px 16px;
      color: #fff;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-header h2 { font-size: 18px; font-weight: 700; }
    .close-btn { background: transparent; color: #9ca3af; font-size: 18px; border: none; padding: 4px 8px; cursor: pointer; }

    .modal-sub-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .trip-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trip-item {
      background: rgba(255, 255, 255, 0.06);
      padding: 12px 14px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .trip-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .color-picker-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      padding: 0;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .color-picker-btn input[type="color"] {
      position: absolute;
      top: -10px;
      left: -10px;
      width: 50px;
      height: 50px;
      opacity: 0;
      cursor: pointer;
    }

    .trip-info h5 { font-size: 13px; font-weight: 600; color: #f3f4f6; margin-bottom: 3px; }
    .trip-info p { font-size: 11px; color: #9ca3af; }

    .trip-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .btn-view-trip { 
      padding: 6px 12px; 
      font-size: 11px; 
      border-radius: 6px; 
      background: #2563eb; 
      color: #fff; 
      flex: initial; 
    }
    .btn-view-trip.active {
      background: #4b5563;
    }

    .btn-delete-trip {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 6px;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      flex: initial;
    }
  </style>
</head>
<body>

  <div id="splash-screen">
    <img src="asflt_icon-512.png" onerror="this.src='asflt_icon-192.png'" alt="Asflt">
    <h1>Asflt</h1>
  </div>

  <div id="map"></div>
  <canvas id="fog-canvas"></canvas>

  <div class="hud">
    <div class="header-row">
      <div class="app-title-wrap">
        <div class="app-title">Asflt</div>
        <div class="trip-badge" id="trip-badge">I ro</div>
      </div>
      <div class="header-actions">
        <button class="btn-secondary btn-badge" id="btn-toggle-fog">Tåke: PÅ</button>
        <button class="btn-secondary btn-badge" id="btn-open-trips">Historikk</button>
      </div>
    </div>

    <div id="visible-route-banner">
      <span id="visible-route-text">Historiske ruter synlige</span>
      <button id="btn-hide-routes">Skjul historikk</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <h4>I dag</h4>
        <div class="stat-val" id="day-dist">0 m</div>
        <div class="stat-val" id="day-steps" style="font-size: 12px; color: #9ca3af;">0 skritt</div>
      </div>
      <div class="stat-card">
        <h4>Aktiv tur</h4>
        <div class="stat-val" id="trip-dist">0 m</div>
        <div class="stat-val" id="trip-steps" style="font-size: 12px; color: #9ca3af;">0 skritt</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-recenter">Sentrer meg</button>
      <button class="btn-secondary" id="btn-manual-new-trip">Start ny tur</button>
    </div>
  </div>

  <div id="trip-modal">
    <div class="modal-header">
      <h2>Lagrede turer</h2>
      <button class="close-btn" id="btn-close-trips">✕ Lukk</button>
    </div>
    <div class="modal-sub-bar">
      <button class="btn-primary" id="btn-modal-all-trips">Vis alle turer</button>
      <button class="btn-secondary" id="btn-modal-hide-trips">Skjul historiske ruter</button>
    </div>
    <div class="trip-list" id="trip-list-container"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { registerPlugin } from '@capacitor/core';
    const BackgroundGeolocation = registerPlugin('BackgroundGeolocation');

    const PALETTE = ['#38bdf8', '#a855f7', '#22c55e', '#f97316', '#ec4899', '#eab308', '#06b6d4', '#ef4444'];
    function getRandomColor() { return PALETTE[Math.floor(Math.random() * PALETTE.length)]; }

    const initialLat = 62.37;
    const initialLng = 6.03;
    let followUser = true;
    let historyDisplayMode = 'none';

    let isFogEnabled = localStorage.getItem('asflt_fog_enabled') !== 'false';

    const map = L.map('map', { zoomControl: false }).setView([initialLat, initialLng], 17);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

    map.on('dragstart', () => { followUser = false; });

    const userMarker = L.circleMarker([initialLat, initialLng], {
      radius: 7, color: '#ffffff', fillColor: '#2563eb', fillOpacity: 1, weight: 3
    }).addTo(map);

    const canvas = document.getElementById('fog-canvas');
    const ctx = canvas.getContext('2d');

    function applyFogVisibility() {
      const btn = document.getElementById('btn-toggle-fog');
      if (isFogEnabled) {
        canvas.style.display = 'block';
        btn.innerText = 'Tåke: PÅ';
        redrawFog();
      } else {
        canvas.style.display = 'none';
        btn.innerText = 'Tåke: AV';
      }
      localStorage.setItem('asflt_fog_enabled', isFogEnabled.toString());
    }

    document.getElementById('btn-toggle-fog').addEventListener('click', () => {
      isFogEnabled = !isFogEnabled;
      applyFogVisibility();
    });

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      map.invalidateSize();
      if (isFogEnabled) redrawFog();
    }
    window.addEventListener('resize', resizeCanvas);

    setTimeout(() => {
      const splash = document.getElementById('splash-screen');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(() => { splash.style.display = 'none'; resizeCanvas(); }, 350);
      }
    }, 1200);

    const todayStr = new Date().toISOString().slice(0, 10);
    let trips = JSON.parse(localStorage.getItem('asflt_trips') || '[]');
    let state = {
      reveals: JSON.parse(localStorage.getItem('asflt_reveals') || '[]'),
      dayDate: localStorage.getItem('asflt_day_date') || todayStr,
      dayDist: parseFloat(localStorage.getItem('asflt_day_dist') || '0'),
      daySteps: parseInt(localStorage.getItem('asflt_day_steps') || '0', 10),
      lastCoord: null
    };

    if (state.dayDate !== todayStr) {
      state.dayDate = todayStr;
      state.dayDist = 0;
      state.daySteps = 0;
      localStorage.setItem('asflt_day_date', todayStr);
      localStorage.setItem('asflt_day_dist', '0');
      localStorage.setItem('asflt_day_steps', '0');
    }

    function createNewTrip(startCoord = null) {
      return {
        id: Date.now(),
        color: getRandomColor(),
        startTime: new Date().toISOString(),
        dist: 0,
        steps: 0,
        path: startCoord ? [startCoord] : []
      };
    }

    // Ved oppstart: Hvis det fantes en gammel aktiv tur, arkiver den og start alltid en FRISK tur med ny farge
    let previousTrip = JSON.parse(localStorage.getItem('asflt_current_trip') || 'null');
    if (previousTrip && previousTrip.dist >= 50 && previousTrip.path && previousTrip.path.length > 2) {
      const exists = trips.some(t => t.id === previousTrip.id);
      if (!exists) {
        trips.unshift(previousTrip);
        localStorage.setItem('asflt_trips', JSON.stringify(trips));
      }
    }

    // Alltid en ny, distinkt tur ved oppstart
    let currentTrip = createNewTrip();
    localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));

    let activeTripPolyline = L.polyline([], {
      color: currentTrip.color,
      weight: 6,
      opacity: 0.95,
      lineCap: 'round',
      lineJoin: 'round'
    }).addTo(map);

    const historyLayers = new Map();

    function updateHistoryRoutes() {
      historyLayers.forEach(layer => map.removeLayer(layer));
      historyLayers.clear();

      const banner = document.getElementById('visible-route-banner');
      const bannerText = document.getElementById('visible-route-text');

      if (historyDisplayMode === 'none') {
        banner.style.display = 'none';
        return;
      }

      banner.style.display = 'flex';

      if (historyDisplayMode === 'all') {
        bannerText.innerText = 'Viser alle historiske turer';
        trips.forEach(t => {
          if (t.id !== currentTrip.id && t.path && t.path.length > 1) {
            const line = L.polyline(t.path.map(p => [p.lat, p.lng]), {
              color: t.color || '#3b82f6',
              weight: 5,
              opacity: 0.85,
              lineCap: 'round',
              lineJoin: 'round'
            }).addTo(map);
            historyLayers.set(t.id, line);
          }
        });
      } else {
        const trip = trips.find(t => t.id === historyDisplayMode);
        if (trip && trip.path && trip.path.length > 1) {
          bannerText.innerText = 'Viser 1 historisk tur';
          const line = L.polyline(trip.path.map(p => [p.lat, p.lng]), {
            color: trip.color || '#38bdf8',
            weight: 6,
            opacity: 0.95,
            lineCap: 'round',
            lineJoin: 'round'
          }).addTo(map);
          historyLayers.set(trip.id, line);
        }
      }
    }

    function hideHistoryRoutes() {
      historyDisplayMode = 'none';
      updateHistoryRoutes();
    }

    document.getElementById('btn-hide-routes').addEventListener('click', hideHistoryRoutes);
    document.getElementById('btn-modal-hide-trips').addEventListener('click', () => {
      hideHistoryRoutes();
      document.getElementById('trip-modal').style.display = 'none';
    });

    document.getElementById('btn-modal-all-trips').addEventListener('click', () => {
      historyDisplayMode = 'all';
      followUser = false;
      document.getElementById('trip-modal').style.display = 'none';
      updateHistoryRoutes();

      const allPoints = [];
      trips.forEach(t => {
        if (t.path) t.path.forEach(p => allPoints.push([p.lat, p.lng]));
      });
      if (currentTrip.path) currentTrip.path.forEach(p => allPoints.push([p.lat, p.lng]));

      if (allPoints.length > 1) {
        map.fitBounds(L.latLngBounds(allPoints), { padding: [50, 50] });
      }
    });

    function showSingleTrip(tripId) {
      if (historyDisplayMode === tripId) {
        historyDisplayMode = 'none';
      } else {
        historyDisplayMode = tripId;
        followUser = false;
        const trip = trips.find(t => t.id === tripId);
        if (trip && trip.path && trip.path.length > 1) {
          map.fitBounds(L.latLngBounds(trip.path.map(p => [p.lat, p.lng])), { padding: [50, 50] });
        }
      }
      updateHistoryRoutes();
    }

    function persistTripSnapshot() {
      localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));
      // Turen lagres/oppdateres i listen så snart den har mer enn 2 punkter
      if (currentTrip.path && currentTrip.path.length >= 2) {
        const idx = trips.findIndex(t => t.id === currentTrip.id);
        if (idx >= 0) {
          trips[idx] = currentTrip;
        } else {
          trips.unshift(currentTrip);
        }
        localStorage.setItem('asflt_trips', JSON.stringify(trips));
      }
    }

    function startNewTrip(startCoord = null) {
      // Sikre at forrige tur er lagret i historikken før ny lages
      if (currentTrip && currentTrip.dist >= 30 && currentTrip.path.length >= 2) {
        const idx = trips.findIndex(t => t.id === currentTrip.id);
        if (idx >= 0) trips[idx] = currentTrip;
        else trips.unshift(currentTrip);
        localStorage.setItem('asflt_trips', JSON.stringify(trips));
      }

      currentTrip = createNewTrip(startCoord);
      localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));

      if (activeTripPolyline) map.removeLayer(activeTripPolyline);
      activeTripPolyline = L.polyline([], {
        color: currentTrip.color,
        weight: 6,
        opacity: 0.95,
        lineCap: 'round',
        lineJoin: 'round'
      }).addTo(map);

      if (startCoord) activeTripPolyline.addLatLng([startCoord.lat, startCoord.lng]);

      updateHistoryRoutes();
      updateUI();
    }

    const REVEAL_RADIUS_METERS = 42;

    function redrawFog() {
      if (!isFogEnabled) return;

      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = 'rgba(10, 12, 18, 0.96)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.globalCompositeOperation = 'destination-out';
      
      for (let i = 0; i < state.reveals.length; i++) {
        drawRevealCircle(state.reveals[i].lat, state.reveals[i].lng);
      }
      if (state.lastCoord) {
        drawRevealCircle(state.lastCoord.lat, state.lastCoord.lng);
      }
    }

    function drawRevealCircle(lat, lng) {
      const containerPoint = map.latLngToContainerPoint([lat, lng]);
      const edgeLatLng = [lat + (REVEAL_RADIUS_METERS / 111320), lng];
      const edgePoint = map.latLngToContainerPoint(edgeLatLng);
      const pixelRadius = Math.max(26, Math.abs(edgePoint.y - containerPoint.y));

      const grad = ctx.createRadialGradient(
        containerPoint.x, containerPoint.y, pixelRadius * 0.45,
        containerPoint.x, containerPoint.y, pixelRadius
      );
      grad.addColorStop(0, 'rgba(0, 0, 0, 1)');
      grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(containerPoint.x, containerPoint.y, pixelRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    map.on('move', () => { if (isFogEnabled) redrawFog(); });
    map.on('zoom', () => { if (isFogEnabled) redrawFog(); });

    function calcDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const phi1 = (lat1 * Math.PI) / 180;
      const phi2 = (lat2 * Math.PI) / 180;
      const dPhi = ((lat2 - lat1) * Math.PI) / 180;
      const dLambda = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dPhi / 2) ** 2 + Math.cos(phi1) * Math.cos(phi2) * Math.sin(dLambda / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function formatDist(meters) {
      return meters >= 1000 ? `${(meters / 1000).toFixed(2)} km` : `${Math.round(meters)} m`;
    }

    function updateUI(statusText = null, statusType = 'normal') {
      document.getElementById('day-dist').innerText = formatDist(state.dayDist);
      document.getElementById('day-steps').innerText = `${state.daySteps} skritt`;
      document.getElementById('trip-dist').innerText = formatDist(currentTrip.dist);
      document.getElementById('trip-steps').innerText = `${currentTrip.steps} skritt`;

      const badge = document.getElementById('trip-badge');
      if (statusText) {
        badge.innerText = statusText;
        badge.className = `trip-badge ${statusType}`;
      }
    }

    // ==========================================
    // ROBUST POSISJON- OG TELEPORTERINGSFILTER
    // ==========================================
    const MAX_WALKING_SPEED_KMH = 19;
    const MAX_WALKING_SPEED_MS = MAX_WALKING_SPEED_KMH / 3.6; // ~5.27 m/s
    const MAX_JUMP_METERS = 75; 
    const INACTIVITY_AUTO_SPLIT_MS = 15 * 60 * 1000; // 15 minutter i ro splitter turen

    let stepTimestamps = [];
    let isHumanWalking = false;
    let lastStepTime = 0;
    let lastFixTime = Date.now();
    let lastMovementTime = Date.now();

    function registerPedometerStep() {
      const now = Date.now();
      const deltaFromLast = now - lastStepTime;

      if (deltaFromLast > 260 && deltaFromLast < 1300) {
        stepTimestamps.push(now);
      } else {
        stepTimestamps = [now];
      }
      lastStepTime = now;

      stepTimestamps = stepTimestamps.filter(t => (now - t) < 6000);

      if (stepTimestamps.length >= 5) {
        if (!isHumanWalking) {
          isHumanWalking = true;
          commitSteps(stepTimestamps.length);
        } else {
          commitSteps(1);
        }
      }
    }

    function commitSteps(count) {
      state.daySteps += count;
      currentTrip.steps += count;
      localStorage.setItem('asflt_day_steps', state.daySteps);
      persistTripSnapshot();
      updateUI('Går', 'walking');
    }

    let lastAccel = 0;
    let stepCooldown = false;
    window.addEventListener('devicemotion', (event) => {
      const acc = event.accelerationIncludingGravity;
      if (!acc) return;
      const mag = Math.sqrt(acc.x ** 2 + acc.y ** 2 + acc.z ** 2);

      if (mag > 11.4 && !stepCooldown && (mag - lastAccel) > 1.3) {
        registerPedometerStep();
        stepCooldown = true;
        setTimeout(() => { stepCooldown = false; }, 260);
      }
      lastAccel = mag;
    });

    let firstFixEver = true;

    function handleLocationUpdate(lat, lng, accuracy, rawSpeed) {
      if (accuracy && accuracy > 35) return;

      const now = Date.now();
      const timeDiffSec = Math.max(1, (now - lastFixTime) / 1000);
      lastFixTime = now;

      userMarker.setLatLng([lat, lng]);
      const currentCoord = { lat, lng };

      if (followUser) {
        map.panTo([lat, lng], { animate: !firstFixEver, duration: 0.6 });
      }

      if (firstFixEver || !state.lastCoord) {
        map.setView([lat, lng], 17);
        firstFixEver = false;
        state.lastCoord = currentCoord;
        state.reveals.push(currentCoord);
        localStorage.setItem('asflt_reveals', JSON.stringify(state.reveals));

        if (currentTrip.path.length === 0) {
          currentTrip.path.push(currentCoord);
          activeTripPolyline.addLatLng([lat, lng]);
        }
        if (isFogEnabled) redrawFog();
        return;
      }

      const deltaMeters = calcDistance(state.lastCoord.lat, state.lastCoord.lng, lat, lng);
      const calculatedSpeedMs = deltaMeters / timeDiffSec;
      const effectiveSpeed = (rawSpeed !== undefined && rawSpeed !== null && rawSpeed >= 0) ? rawSpeed : calculatedSpeedMs;

      // 1. Sjekk om det har gått over 15 minutter i ro siden forrige bevegelse:
      if ((now - lastMovementTime) > INACTIVITY_AUTO_SPLIT_MS && deltaMeters > 30) {
        startNewTrip(currentCoord);
        state.lastCoord = currentCoord;
        lastMovementTime = now;
        return;
      }

      // 2. Kjøretøy / GPS-hopp / Teleport:
      if (deltaMeters > MAX_JUMP_METERS || effectiveSpeed > MAX_WALKING_SPEED_MS) {
        startNewTrip(currentCoord);
        state.lastCoord = currentCoord;
        lastMovementTime = now;
        isHumanWalking = false;
        updateUI('Kjører / Hopp', 'vehicle');
        return;
      }

      // 3. I ro:
      const hasRecentStep = (now - lastStepTime) < 5000;
      if (!hasRecentStep && deltaMeters < 3.5) {
        isHumanWalking = false;
        updateUI('I ro', 'normal');
        return;
      }

      // 4. Gyldig gange registrert:
      if (deltaMeters >= 2.5 && deltaMeters <= MAX_JUMP_METERS) {
        lastMovementTime = now;

        state.dayDist += deltaMeters;
        localStorage.setItem('asflt_day_dist', state.dayDist);

        currentTrip.dist += deltaMeters;
        currentTrip.path.push(currentCoord);
        activeTripPolyline.addLatLng([lat, lng]);

        if (!hasRecentStep) {
          const fallbackSteps = Math.max(1, Math.round(deltaMeters / 0.74));
          state.daySteps += fallbackSteps;
          currentTrip.steps += fallbackSteps;
          localStorage.setItem('asflt_day_steps', state.daySteps);
        }

        state.reveals.push(currentCoord);
        localStorage.setItem('asflt_reveals', JSON.stringify(state.reveals));

        state.lastCoord = currentCoord;
        persistTripSnapshot();
        if (isFogEnabled) redrawFog();

        updateUI('Går', 'walking');
      }
    }

    async function startTracking() {
      try {
        await BackgroundGeolocation.addWatcher(
          {
            backgroundMessage: "Asflt holder kartet oppdatert i bakgrunnen.",
            backgroundTitle: "Asflt sporer turen",
            requestPermissions: true,
            stale: false,
            distanceFilter: 3
          },
          (location, error) => {
            if (error) {
              console.warn("BackgroundGeolocation error:", error);
              return;
            }
            if (location) {
              handleLocationUpdate(location.latitude, location.longitude, location.accuracy, location.speed);
            }
          }
        );
      } catch (err) {
        console.warn("Faller tilbake til nettleser-GPS:", err);
        if ('geolocation' in navigator) {
          navigator.geolocation.watchPosition(
            pos => handleLocationUpdate(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, pos.coords.speed),
            e => console.warn(e),
            { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
          );
        }
      }
    }

    startTracking();

    const modal = document.getElementById('trip-modal');
    const tripListContainer = document.getElementById('trip-list-container');

    document.getElementById('btn-open-trips').addEventListener('click', () => {
      renderTripList();
      modal.style.display = 'flex';
    });

    document.getElementById('btn-close-trips').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    function deleteTrip(idx) {
      if (!confirm("Vil du slette denne turen fra listen? (Kartet forblir utforsket)")) return;
      const deleted = trips.splice(idx, 1)[0];
      localStorage.setItem('asflt_trips', JSON.stringify(trips));

      if (historyDisplayMode === deleted.id) {
        historyDisplayMode = 'none';
      }

      updateHistoryRoutes();

      if (currentTrip && currentTrip.id === deleted.id) {
        startNewTrip(state.lastCoord);
      }

      renderTripList();
    }

    function renderTripList() {
      tripListContainer.innerHTML = '';
      if (trips.length === 0) {
        tripListContainer.innerHTML = '<p style="color: #9ca3af; text-align: center; margin-top: 40px;">Ingen turer lagret enda.</p>';
        return;
      }

      trips.forEach((t, idx) => {
        const date = new Date(t.startTime).toLocaleDateString('no-NO', { 
          day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' 
        });
        const color = t.color || '#3b82f6';
        const isCurrentlyShown = historyDisplayMode === t.id;
        
        const item = document.createElement('div');
        item.className = 'trip-item';
        item.innerHTML = `
          <div class="trip-left">
            <div class="color-picker-btn" style="background: ${color};" title="Endre farge">
              <input type="color" value="${color}" data-idx="${idx}">
            </div>
            <div class="trip-info">
              <h5>Tur #${trips.length - idx} – ${date}</h5>
              <p>${formatDist(t.dist)} • ${t.steps} skritt</p>
            </div>
          </div>
          <div class="trip-actions">
            <button class="btn-view-trip ${isCurrentlyShown ? 'active' : ''}" data-id="${t.id}">
              ${isCurrentlyShown ? 'Skjul' : 'Vis'}
            </button>
            <button class="btn-delete-trip" data-del-idx="${idx}">Slett</button>
          </div>
        `;
        tripListContainer.appendChild(item);
      });

      document.querySelectorAll('.color-picker-btn input[type="color"]').forEach(input => {
        input.addEventListener('input', (e) => {
          const idx = parseInt(e.target.getAttribute('data-idx'), 10);
          const newColor = e.target.value;
          trips[idx].color = newColor;
          e.target.parentElement.style.background = newColor;

          if (historyLayers.has(trips[idx].id)) {
            historyLayers.get(trips[idx].id).setStyle({ color: newColor });
          }

          if (currentTrip && currentTrip.id === trips[idx].id) {
            currentTrip.color = newColor;
            activeTripPolyline.setStyle({ color: newColor });
            localStorage.setItem('asflt_current_trip', JSON.stringify(currentTrip));
          }

          localStorage.setItem('asflt_trips', JSON.stringify(trips));
        });
      });

      document.querySelectorAll('.btn-view-trip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const tripId = parseInt(e.target.getAttribute('data-id'), 10);
          modal.style.display = 'none';
          showSingleTrip(tripId);
        });
      });

      document.querySelectorAll('.btn-delete-trip').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = parseInt(e.target.getAttribute('data-del-idx'), 10);
          deleteTrip(idx);
        });
      });
    }

    document.getElementById('btn-recenter').addEventListener('click', () => {
      followUser = true;
      if (state.lastCoord) {
        map.setView([state.lastCoord.lat, state.lastCoord.lng], 17);
      }
      if (isFogEnabled) redrawFog();
    });

    document.getElementById('btn-manual-new-trip').addEventListener('click', () => {
      startNewTrip(state.lastCoord);
    });

    applyFogVisibility();
    updateHistoryRoutes();
    resizeCanvas();
    updateUI();
  </script>
</body>
</html>
