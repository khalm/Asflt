name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js asflt_icon*.png www/ 2>/dev/null || cp index.html www/

      - name: Install dependencies
        run: npm install

      - name: Add Android platform and configure icons & permissions
        run: |
          npx cap add android

          # Ikoner
          ICON_FILE=$(ls asflt_icon-512.png 2>/dev/null || ls asflt_icon*.png 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ] && [[ "$dir" != *"anydpi"* ]]; then
                cp "$ICON_FILE" "$dir/ic_launcher.png"
                cp "$ICON_FILE" "$dir/ic_launcher_round.png"
                cp "$ICON_FILE" "$dir/ic_launcher_foreground.png"
              fi
            done

            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            cat << 'EOF' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@color/ic_launcher_background"/>
    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
</adaptive-icon>
EOF
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
            
            mkdir -p android/app/src/main/res/values
            cat << 'EOF' > android/app/src/main/res/values/ic_launcher_background.xml
<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#1a1a1e</color>
</resources>
EOF
          fi

          # VIKTIG: Gi internett, posisjon og nettverkstilgang til appen
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asflt-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
