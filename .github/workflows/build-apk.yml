name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Build web bundle with Vite
        run: npm run build

      - name: Add Android platform and configure permissions & icons
        run: |
          npx cap add android
          npx cap sync android

          ICON_FILE=$(ls asflt_icon-512.png 2>/dev/null || ls asflt_icon*.png 2>/dev/null | head -n 1)
          if [ -n "$ICON_FILE" ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ] && [[ "$dir" != *"anydpi"* ]]; then
                cp "$ICON_FILE" "$dir/ic_launcher.png"
                cp "$ICON_FILE" "$dir/ic_launcher_round.png"
                cp "$ICON_FILE" "$dir/ic_launcher_foreground.png"
              fi
            done

            mkdir -p android/app/src/main/res/mipmap-anydpi-v26
            echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <background android:drawable="@color/ic_launcher_background"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            echo '</adaptive-icon>' >> android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
            
            cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

            mkdir -p android/app/src/main/res/values
            echo '<?xml version="1.0" encoding="utf-8"?>' > android/app/src/main/res/values/ic_launcher_background.xml
            echo '<resources>' >> android/app/src/main/res/values/ic_launcher_background.xml
            echo '    <color name="ic_launcher_background">#1a1a1e</color>' >> android/app/src/main/res/values/ic_launcher_background.xml
            echo '</resources>' >> android/app/src/main/res/values/ic_launcher_background.xml
          fi

          # Sikrer alle bakgrunns- og service-rettigheter i AndroidManifest.xml
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asflt-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
